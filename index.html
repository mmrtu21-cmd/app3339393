<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Расписание 8Д</title>
<style>
:root{
  --bg:#050506;--text:#f5f5f7;--muted:#98989f;
  --glass:rgba(30,30,32,.62);--border:rgba(255,255,255,.11);
  --blue:#0a84ff;--green:#30d158;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
    radial-gradient(circle at 15% -10%,rgba(60,90,170,.20),transparent 35%),
    radial-gradient(circle at 100% 80%,rgba(90,50,150,.12),transparent 35%),#050506;
}
body:before,body:after{
  content:"";position:fixed;width:280px;height:280px;border-radius:50%;
  filter:blur(75px);opacity:.12;pointer-events:none;z-index:-1
}
body:before{background:#1769ff;top:-150px;left:-100px;animation:float1 12s ease-in-out infinite alternate}
body:after{background:#713cff;right:-150px;bottom:-100px;animation:float2 15s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(90px,100px)}}@keyframes float2{to{transform:translate(-80px,-70px)}}

.app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}
.header{padding:20px 5px 17px;animation:fadeDown .55s both}
.header-row{display:flex;align-items:center;justify-content:space-between}
.title{font-size:32px;font-weight:700;letter-spacing:-.9px}
.subtitle{margin-top:4px;color:var(--muted);font-size:15px}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.35)}60%{box-shadow:0 0 0 8px rgba(48,209,88,0)}}

.glass{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),var(--glass);
  border:1px solid var(--border);box-shadow:0 15px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
}
.glass:after{
  content:"";position:absolute;width:80px;height:180%;top:-40%;left:-130px;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);
  pointer-events:none;animation:shine 8s ease-in-out infinite;
}
@keyframes shine{0%,45%{left:-130px}70%,100%{left:120%}}

.date-card{border-radius:22px;padding:16px 18px;margin-bottom:10px;animation:appear .55s .08s both}
.date{font-size:17px;font-weight:600}.clock{margin-top:4px;color:var(--muted);font-size:14px}

.current{border-radius:25px;padding:20px;margin-bottom:10px;animation:appear .55s .07s both}
.current-label{color:var(--muted);font-size:13px}
.current-title{margin-top:6px;font-size:25px;font-weight:700;letter-spacing:-.4px}
.current-time{margin-top:5px;color:var(--muted);font-size:14px}

.days{display:flex;gap:7px;overflow-x:auto;margin:15px 0 11px;scrollbar-width:none;animation:appear .55s .2s both}
.days::-webkit-scrollbar{display:none}
.day{
  flex:1;min-width:58px;padding:11px 8px;border-radius:15px;
  border:1px solid var(--border);background:rgba(255,255,255,.035);
  color:var(--muted);font-size:14px;font-weight:600;text-align:center;cursor:pointer;
  transition:.25s cubic-bezier(.2,.8,.2,1)
}
.day:active{transform:scale(.91)}
.day.active{color:#fff;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.18);animation:dayPop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes dayPop{0%{transform:scale(.88)}65%{transform:scale(1.05)}100%{transform:scale(1)}}

.section-title{padding:8px 5px;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}

/* ПРЕДМЕТЫ ПАДАЮТ СВЕРХУ В КВАДРАТНЫЕ СТЕКЛЯННЫЕ КАРТОЧКИ */
.lesson{
  position:relative;display:flex;align-items:center;min-height:72px;padding:12px 14px;
  margin-bottom:9px;border-radius:20px;border:1px solid rgba(255,255,255,.11);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:0 10px 25px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
  overflow:hidden;transform-origin:center top;
  animation:subjectDrop .65s cubic-bezier(.16,1,.3,1) both;
}
.lesson:nth-child(1){animation-delay:.02s}.lesson:nth-child(2){animation-delay:.07s}
.lesson:nth-child(3){animation-delay:.12s}.lesson:nth-child(4){animation-delay:.17s}
.lesson:nth-child(5){animation-delay:.22s}.lesson:nth-child(6){animation-delay:.27s}
.lesson:nth-child(7){animation-delay:.32s}.lesson:nth-child(8){animation-delay:.37s}
.lesson:nth-child(9){animation-delay:.42s}
@keyframes subjectDrop{
  0%{opacity:0;transform:translateY(-55px) scale(.90) rotateX(-8deg);filter:blur(3px)}
  45%{opacity:1}
  70%{transform:translateY(2px) scale(1.01) rotateX(2deg);filter:blur(0)}
  85%{transform:translateY(-3px) scale(.995)}
  100%{opacity:1;transform:translateY(0) scale(1) rotateX(0);filter:blur(0)}
}
.lesson:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.055) 50%,transparent 70%);
  transform:translateX(-120%);animation:cardShine 4.5s 1s ease-in-out infinite;
}
@keyframes cardShine{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
.lesson:active{transform:scale(.96);transition:.12s}
.lesson.active{
  background:linear-gradient(145deg,rgba(10,132,255,.18),rgba(10,132,255,.07));
  border-color:rgba(10,132,255,.42);
  box-shadow:0 10px 30px rgba(10,132,255,.12),inset 0 1px 0 rgba(255,255,255,.08)
}
.number{
  width:40px;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;
  margin-right:13px;border-radius:13px;background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.08);color:#b8b8bd;font-size:14px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:.3s cubic-bezier(.2,.8,.2,1)
}
.lesson.active .number{background:var(--blue);color:#fff;transform:scale(1.08);box-shadow:0 5px 18px rgba(10,132,255,.3)}
.lesson-content{flex:1;min-width:0}.lesson-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-time{margin-top:4px;color:var(--muted);font-size:13px}.lesson-status{margin-left:8px;color:var(--blue);font-size:10px;font-weight:700}

.settings{margin-top:17px;border-radius:22px;overflow:hidden;animation:appear .55s .4s both}
.setting{display:flex;align-items:center;justify-content:space-between;padding:16px 17px;border-bottom:1px solid var(--border)}
.setting:last-child{border-bottom:none}.setting-title{font-size:15px;font-weight:600}.setting-subtitle{margin-top:3px;color:var(--muted);font-size:12px}
.switch{width:49px;height:29px;padding:3px;border-radius:20px;background:#39393d;transition:.25s;cursor:pointer}
.switch-knob{width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:.3s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--green)}.switch.on .switch-knob{transform:translateX(20px)}
.select-wrapper{width:100%}select{width:100%;margin-top:6px;border:0;outline:0;color:var(--muted);background:transparent;appearance:none;font-size:14px}
.empty{padding:35px 15px;text-align:center;color:var(--muted);border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));width:calc(100% - 30px);max-width:580px;
  padding:13px 16px;transform:translate(-50%,80px);opacity:0;border-radius:17px;
  background:rgba(35,35,38,.88);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);color:#fff;font-size:14px;font-weight:600;text-align:center;
  transition:.3s;z-index:1000
}
.toast.show{transform:translate(-50%,0);opacity:1}
.footer{padding:22px 0 5px;color:#55555b;text-align:center;font-size:11px}
@keyframes fadeDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =========================================================
   АДАПТАЦИЯ ПОД ВСЕ ЭКРАНЫ И УСТРОЙСТВА
========================================================= */

/* Базовая стабилизация размеров */
html {
  min-width: 320px;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-width: 320px;
  min-height: 100svh;
}

/* Контент не растягивается слишком сильно на планшетах/ПК */
.app {
  width: min(100%, 680px);
  min-height: 100svh;
  margin-inline: auto;
}

/* Большие телефоны */
@media (min-width: 430px) {
  .app {
    padding-left: 18px;
    padding-right: 18px;
  }

  .lesson {
    min-height: 74px;
  }
}

/* Планшеты */
@media (min-width: 700px) {
  .app {
    width: min(100% - 40px, 680px);
    padding-top: max(24px, env(safe-area-inset-top));
  }

  .title {
    font-size: 34px;
  }

  .lesson {
    min-height: 76px;
    padding: 13px 16px;
  }

  .number {
    width: 42px;
    height: 42px;
    min-width: 42px;
  }
}

/* Десктоп/ноутбук */
@media (min-width: 1000px) {
  body {
    display: flex;
    justify-content: center;
  }

  .app {
    width: 680px;
    padding-top: 28px;
  }

  .lesson:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,.17);
    background:
      linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  }

  .day:hover {
    color: #fff;
    background: rgba(255,255,255,.08);
  }
}

/* Очень маленькие телефоны */
@media (max-width: 360px) {
  .app {
    padding-left: 10px;
    padding-right: 10px;
  }

  .title {
    font-size: 28px;
  }

  .subtitle {
    font-size: 14px;
  }

  .current {
    padding: 17px;
  }

  .current-title {
    font-size: 22px;
  }

  .lesson {
    min-height: 64px;
    padding: 9px 10px;
    border-radius: 17px;
  }

  .number {
    width: 36px;
    height: 36px;
    min-width: 36px;
    margin-right: 10px;
    border-radius: 11px;
  }

  .lesson-name {
    font-size: 15px;
  }

  .lesson-time {
    font-size: 12px;
  }

  .lesson-status {
    font-size: 9px;
  }

  .day {
    min-width: 52px;
    padding: 10px 6px;
  }
}

/* Низкие экраны — уменьшаем вертикальные отступы */
@media (max-height: 650px) {
  .header {
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .date-card {
    padding: 12px 15px;
  }

  .current {
    padding: 15px;
  }

  .days {
    margin-top: 10px;
    margin-bottom: 7px;
  }

  .lesson {
    min-height: 58px;
    margin-bottom: 6px;
    padding: 8px 11px;
  }

  .number {
    width: 34px;
    height: 34px;
    min-width: 34px;
  }
}

/* Ландшафт телефона */
@media (orientation: landscape) and (max-height: 600px) {
  .app {
    max-width: 760px;
    padding-top: 8px;
  }

  .header {
    padding: 8px 5px;
  }

  .date-card,
  .current {
    margin-bottom: 7px;
  }

  .current {
    padding: 12px 16px;
  }

  .current-title {
    font-size: 21px;
  }

  .days {
    margin: 9px 0 7px;
  }

  .lesson {
    min-height: 54px;
  }

  .settings {
    margin-top: 10px;
  }

  .footer {
    padding-top: 12px;
  }
}

/* Устройства с мышью: не используем hover на сенсорных экранах */
@media (hover: none) {
  .lesson:hover,
  .day:hover {
    transform: none;
  }
}

/* Если устройство слабое — отключаем тяжёлый blur, сохраняя вид */
@media (prefers-reduced-motion: reduce) {
  .glass {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  body:before,
  body:after,
  .glass:after,
  .lesson:before {
    display: none;
  }
}

/* Поддержка старых браузеров без backdrop-filter */
@supports not (backdrop-filter: blur(1px)) {
  .glass,
  .toast,
  .lesson {
    background: rgba(28,28,30,.96);
  }
}

/* Безопасные зоны для устройств с вырезами */
@supports (padding: max(0px)) {
  .app {
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
  }
}

/* Не даём длинным русским названиям ломать карточки */
.lesson-name,
.current-title,
.setting-title {
  overflow-wrap: anywhere;
  word-break: normal;
}

/* Комфортные размеры для мыши/клавиатуры */
@media (pointer: fine) {
  .day,
  .switch,
  .setting[onclick] {
    cursor: pointer;
  }
}

/* Фокус для клавиатуры */
.day:focus-visible,
.switch:focus-visible,
select:focus-visible,
.setting[onclick]:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="header-row">
    <div><div class="title">Расписание</div><div class="subtitle">8Д • Школьный день</div></div>
    <div class="status-dot"></div>
  </div>
</header>

<div class="glass date-card"><div class="date" id="date"></div><div class="clock" id="clock"></div></div>

<div class="glass current">
  <div class="current-label" id="nextLabel">Следующий урок</div>
  <div class="current-title" id="nextTitle">Загрузка...</div>
  <div class="current-time" id="nextTime"></div>
</div>

<div class="days" id="dayTabs"></div>
<div class="section-title">Уроки</div>
<div id="schedule"></div>

<div class="glass settings">
  <div class="setting">
    <div><div class="setting-title">Напоминания</div><div class="setting-subtitle">Уведомление перед уроком</div></div>
    <div class="switch" id="reminderSwitch" onclick="toggleReminders()"><div class="switch-knob"></div></div>
  </div>
  <div class="setting">
    <div class="select-wrapper">
      <div class="setting-title">Напомнить за</div>
      <select id="reminderMinutes" onchange="saveSettings()">
        <option value="1">1 минуту</option><option value="5" selected>5 минут</option>
        <option value="10">10 минут</option><option value="15">15 минут</option>
      </select>
    </div>
  </div>
  <div class="setting" onclick="requestNotifications()" style="cursor:pointer">
    <div><div class="setting-title">Разрешить уведомления</div><div class="setting-subtitle">Включить системные уведомления</div></div>
    <div style="color:#0a84ff;font-size:20px">›</div>
  </div>
</div>
<div class="footer">8Д</div>
</div>
<div class="toast" id="toast"></div>

<script>
const lessonTimes=[
 ["08:00","08:40"],["08:50","09:30"],["09:50","10:30"],
 ["10:50","11:30"],["11:50","12:30"],["12:40","13:20"],
 ["13:30","14:10"],["14:20","15:00"],["15:10","15:50"]
];

const schedule={
 1:["Разговоры о важном","Русский язык","Физ-ра (самбо)","Физика","Алгебра","Биология","Информатика"],
 2:["Литература","История","Иностранный язык","Физика","Алгебра","Русский язык","ОБЗР"],
 3:["Химия","Иностранный язык","Геометрия","Геометрия","Русский язык","История","Физ-ра"],
 4:["Россия — мои горизонты","Алгебра","Физ-ра","География","Химия","Иностранный язык","Музыка"],
 5:["История","Литература","Вероятность","География","Труд (технология)","Биология","Практикум по геометрии"]
};

const dayNames=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const shortDays=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
let selectedDay=new Date().getDay();
if(selectedDay===0||selectedDay===6)selectedDay=1;

let remindersEnabled=localStorage.getItem("reminders")!=="false";
let reminderMinutes=Number(localStorage.getItem("reminderMinutes")||5);
document.getElementById("reminderMinutes").value=reminderMinutes;

function updateClock(){
 const now=new Date();
 let d=now.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
 document.getElementById("date").textContent=d.charAt(0).toUpperCase()+d.slice(1);
 document.getElementById("clock").textContent=now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function renderDayTabs(){
 const c=document.getElementById("dayTabs");c.innerHTML="";
 for(let day=1;day<=5;day++){
  const b=document.createElement("div");b.className="day"+(day===selectedDay?" active":"");b.textContent=shortDays[day];
  b.onclick=()=>{selectedDay=day;renderDayTabs();renderSchedule()};c.appendChild(b);
 }
}
function renderSchedule(){
 const c=document.getElementById("schedule");c.innerHTML="";
 const lessons=schedule[selectedDay];
 if(!lessons){c.innerHTML='<div class="empty">Выходной</div>';return}
 lessons.forEach((name,index)=>{
  const el=document.createElement("div");el.className="lesson";el.dataset.index=index;
  el.innerHTML=`<div class="number">${index+1}</div><div class="lesson-content"><div class="lesson-name">${name}</div><div class="lesson-time">${lessonTimes[index][0]} — ${lessonTimes[index][1]}</div></div><div class="lesson-status"></div>`;
  c.appendChild(el);
 });
 updateActiveLesson();
}
function timeToMinutes(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function updateActiveLesson(){
 const now=new Date(),cm=now.getHours()*60+now.getMinutes(),lessons=schedule[selectedDay];
 if(!lessons)return;
 let current=null,next=null;
 lessons.forEach((name,i)=>{
  const s=timeToMinutes(lessonTimes[i][0]),e=timeToMinutes(lessonTimes[i][1]);
  if(selectedDay===now.getDay()&&cm>=s&&cm<e)current=i;
  if(selectedDay===now.getDay()&&cm<s&&next===null)next=i;
 });
 document.querySelectorAll(".lesson").forEach(el=>{
  const i=Number(el.dataset.index);el.classList.toggle("active",i===current);
  el.querySelector(".lesson-status").textContent=i===current?"СЕЙЧАС":"";
 });
 updateNextCard(current,next);
}
function updateNextCard(current,next){
 const title=document.getElementById("nextTitle"),label=document.getElementById("nextLabel"),time=document.getElementById("nextTime"),now=new Date();
 if(selectedDay!==now.getDay()){
  const l=schedule[selectedDay];if(!l)return;
  label.textContent=dayNames[selectedDay];title.textContent=l[0];time.textContent=`${lessonTimes[0][0]} — ${lessonTimes[0][1]}`;return;
 }
 if(current!==null){
  const l=schedule[selectedDay];label.textContent="Сейчас";title.textContent=l[current];time.textContent=`${lessonTimes[current][0]} — ${lessonTimes[current][1]}`;return;
 }
 if(next!==null){
  const l=schedule[selectedDay];label.textContent="Следующий урок";title.textContent=l[next];time.textContent=`${lessonTimes[next][0]} — ${lessonTimes[next][1]}`;return;
 }
 label.textContent="На сегодня всё";title.textContent="Уроков больше нет";time.textContent="Можно отдыхать";
}
async function requestNotifications(){
 if(!("Notification"in window)){showToast("Уведомления не поддерживаются");return}
 const p=await Notification.requestPermission();
 if(p==="granted"){showToast("Уведомления включены");new Notification("Расписание",{body:"Напоминания об уроках включены."})}
 else showToast("Разрешение не получено");
}
let notified={};
function checkReminders(){
 if(!remindersEnabled||!("Notification"in window)||Notification.permission!=="granted")return;
 const now=new Date(),day=now.getDay();if(day<1||day>5)return;
 const lessons=schedule[day],cm=now.getHours()*60+now.getMinutes();
 lessons.forEach((name,i)=>{
  const diff=timeToMinutes(lessonTimes[i][0])-cm,key=`${now.toDateString()}-${i}`;
  if(diff===reminderMinutes&&!notified[key+"b"]){new Notification("Скоро урок",{body:`${name} начнётся через ${reminderMinutes} мин.`});notified[key+"b"]=1}
  if(diff===0&&!notified[key+"s"]){new Notification("Урок начался",{body:`${name} — сейчас.`});notified[key+"s"]=1}
 });
}
function toggleReminders(){remindersEnabled=!remindersEnabled;localStorage.setItem("reminders",remindersEnabled);updateSwitch();showToast(remindersEnabled?"Напоминания включены":"Напоминания выключены")}
function updateSwitch(){document.getElementById("reminderSwitch").classList.toggle("on",remindersEnabled)}
function saveSettings(){reminderMinutes=Number(document.getElementById("reminderMinutes").value);localStorage.setItem("reminderMinutes",reminderMinutes);showToast(`Напоминание за ${reminderMinutes} мин.`)}
let toastTimer;
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove("show"),2800)}

renderDayTabs();renderSchedule();updateSwitch();updateClock();
setInterval(()=>{
  if (!document.hidden) {
    updateClock();
    updateActiveLesson();
    checkReminders();
  }
},1000);
</script>
